# Final APK for a customer, with their Odoo server built in.
# GitHub > Actions > "Build customer APK" > Run workflow, fill the form.
# Needs the permanent signing key secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD): a final APK must always be signed with the same key,
# otherwise later updates will not install over it.
name: Build customer APK

on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer short name, used in the file name (e.g. kalaimagal)'
        required: true
      server_url:
        description: 'Odoo address, e.g. http://[SERVER-IP]:8069 or https://erp.example.com'
        required: true
      database:
        description: 'Database name (leave empty to choose it at login)'
        required: false
        default: ''
      own_contacts_only:
        description: 'Each login sees only the customers it created'
        type: boolean
        default: true
      shared_login:
        description: 'All staff share one Odoo login (app asks each person''s name)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Permanent signing key (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the signing key secrets first (see README, 'Signing key'). A final APK must not use the temporary debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build
        env:
          SERVER: ${{ inputs.server_url }}
          DB: ${{ inputs.database }}
          OWN: ${{ inputs.own_contacts_only }}
          SHARED: ${{ inputs.shared_login }}
          CUSTOMER: ${{ inputs.customer }}
        run: |
          case "$SERVER" in
            http://*) HTTP=true ;;
            https://*) HTTP=false ;;
            *) echo "::error::server_url must start with http:// or https://"; exit 1 ;;
          esac
          export ORG_GRADLE_PROJECT_allowHttp=$HTTP
          flutter build apk --release \
            --dart-define=DEFAULT_SERVER="$SERVER" \
            --dart-define=DEFAULT_DATABASE="$DB" \
            --dart-define=OWN_CONTACTS_ONLY=$OWN \
            --dart-define=SHARED_LOGIN=$SHARED \
            --dart-define=ALLOW_HTTP=$HTTP
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NAME=$(echo "$CUSTOMER" | tr -cd 'A-Za-z0-9_-')
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/field-locator-$NAME-$VERSION.apk"
          echo "APK_NAME=field-locator-$NAME-$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/app/outputs/flutter-apk/${{ env.APK_NAME }}.apk
