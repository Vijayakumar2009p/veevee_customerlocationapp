name: veevee_field_locator
description: "VeeVee Field Locator - pin customer GPS locations into Odoo 19."
publish_to: 'none'

# Keep in step with AppConfig.appVersion in lib/config.dart.
version: 1.4.0+16

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
